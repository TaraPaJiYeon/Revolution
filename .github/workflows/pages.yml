name: Deploy docs to GitHub Pages

# 把 Revolution.Document/ 发布成在线文档站（入口就是那份 index.html）
#
# 触发：文档目录或本工作流有改动时；也可以在 Actions 页面手动 Run workflow。
# 另外：就算线上没开，本地随时可看 —— 双击 Revolution.Document/预览文档.cmd，或直接双击 index.html。
on:
  push:
    branches: [main]
    paths:
      - 'Revolution.Document/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# GitHub Pages 官方要求的三项权限
permissions:
  contents: read      # 读仓库
  pages: write        # 写 Pages 站点
  id-token: write     # 部署用的 OIDC 令牌

# 同一时间只跑一份；不取消正在进行的部署（避免站点处于半发布状态）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.pages.outcome != 'success' }}   # 传下去：Pages 不可用就别白跑部署
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # enablement: true = 若仓库还没开 Pages，就用工作流令牌帮你开（省掉手动去 Settings 点一步）
      # continue-on-error：私有仓库 + Free 计划会失败 —— 那种情况交给下一步给出可读提示，而不是让工作流报红
      - name: 准备 Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages 不可用时的说明
        if: steps.pages.outcome != 'success'
        run: |
          # 探一下站点到底能不能访问（注意：不要用 api.github.com/.../pages 判断 ——
          # 那个接口匿名访问时即使站点已上线也返回 404，会误报；这里直接探站点地址）
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER,,}.github.io/${REPO}/"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")
          echo "站点探针：$URL → HTTP $CODE"
          echo "::warning title=Pages 未启用::站点未发布（$URL 返回 $CODE）。请到仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」（需仓库 admin 点一次），然后重跑本工作流。本地预览：双击 Revolution.Document/预览文档.cmd。"
          {
            echo "## 📄 文档站未发布：Pages 还没开（站点探针返回 $CODE）"
            echo ""
            echo "**一次性操作**（做完本工作流全自动，之后改文档即自动发布）："
            echo ""
            echo "1. 打开 https://github.com/${GITHUB_REPOSITORY}/settings/pages"
            echo "2. **Build and deployment → Source** 选 **GitHub Actions**（不要选 Deploy from a branch）"
            echo "3. 回到本工作流点 **Re-run all jobs**，或再推一次 \`Revolution.Document/\` 里的改动"
            echo ""
            echo "预期站点地址：$URL"
            echo ""
            echo "> 为什么必须手动这一步：Pages 站点必须由**有 admin 权限的人**创建一次 —— 工作流令牌没有这个权限，"
            echo "> 报错原文是 \`Resource not accessible by integration\`（Create Pages site failed）。"
            echo "> 若第 2 步里看不到 GitHub Actions 选项：说明该仓库的 Pages 不可用（私有仓库需要 Pro/Team 计划；Public 仓库不受限）。"
            echo "> 本地随时可看：双击 \`Revolution.Document/预览文档.cmd\`，或直接双击 \`index.html\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 生成站点文件
        if: steps.pages.outcome == 'success'
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          doc  = pathlib.Path('Revolution.Document')
          site = pathlib.Path('_site')
          site.mkdir(exist_ok=True)

          # ① 拷贝文档目录（按扩展名白名单：跳过 .cmd 这类辅助文件，带上公共样式 assets/docs.css）
          KEEP = {'.html', '.md', '.css', '.js', '.png', '.jpg', '.jpeg', '.svg', '.gif', '.webp'}
          for p in doc.rglob('*'):
              if p.is_file() and p.suffix.lower() in KEEP:
                  dst = site / p.relative_to(doc)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(p.read_bytes())

          # ② .nojekyll：不再让 Pages 走 Jekyll 处理（否则下划线开头的文件会被跳过）
          (site / '.nojekyll').write_text('')

          # ③ 链接修正（逐个 HTML 文件，按其所在目录解析）：
          #    · 站内确实存在的目标（如 ../index.html、../assets/docs.css、同目录 .html）→ 保持相对链接
          #    · .md 文档 → 指到 GitHub 渲染版（浏览器直接看 .md 是纯文本/会下载）
          #    · 站点之外（../README.md、../LICENSE、../RevolutionFrameWork_Unity/…）→ 指到 GitHub
          repo = os.environ.get('GITHUB_REPOSITORY', 'Yokino337088/Revolution')
          blob = f'https://github.com/{repo}/blob/main/'
          site_abs = site.resolve()

          pages = sorted(site.rglob('*.html'))
          total = 0
          for page in pages:
              html = page.read_text(encoding='utf-8')

              def fix(m, page=page):
                  href = m.group(1)
                  if href.startswith(('http://', 'https://', '#', 'mailto:', 'data:')):
                      return m.group(0)
                  target = (page.parent / href.split('#')[0]).resolve()
                  try:
                      rel = target.relative_to(site_abs).as_posix()
                      inside = True
                  except ValueError:
                      rel, inside = None, False

                  if href.endswith('.md'):
                      # 站内是纯文本，站外（仓库根）反正是仓库里的文件 → 一律 GitHub 渲染版
                      path = f'Revolution.Document/{rel}' if inside else href[3:].split('#')[0]
                      return f'href="{blob}{path}"'
                  if not inside:
                      # 站点之外：仓库根的 README / LICENSE / 框架目录
                      return f'href="{blob}{href[3:].split("#")[0]}"'
                  return m.group(0)

              html, n = re.subn(r'href="([^"]+)"', fix, html)
              if n:
                  page.write_text(html, encoding='utf-8')
                  total += n

          files = [f for f in site.rglob('*') if f.is_file()]
          print(f'站点文件 {len(files)} 个 / 处理 HTML {len(pages)} 个 / 检查链接 {total} 处')
          PY

      - name: 上传站点产物
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
