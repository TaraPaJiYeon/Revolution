name: Deploy docs to GitHub Pages

# 把 Revolution.Document/ 发布成在线文档站（入口就是那份 index.html）
#
# 触发：文档目录或本工作流有改动时；也可以在 Actions 页面手动 Run workflow。
#
# ⚠️ 前置条件：GitHub Pages 对「私有仓库」只在付费计划（Pro / Team / Enterprise）下可用。
#    · 仓库是 Public          → 直接可用，本工作流会自动开启 Pages 并部署；
#    · 仓库是 Private（Free） → 无法发布。此时本工作流**不会报错**，而是在运行摘要里给出提示后跳过
#      （要上线：① 把仓库改成 Public 后重跑；② 或升级计划后重跑）。
#    另外：就算线上没开，本地随时可看 —— 双击 Revolution.Document/预览文档.cmd，或直接双击 index.html。
on:
  push:
    branches: [main]
    paths:
      - 'Revolution.Document/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# GitHub Pages 官方要求的三项权限
permissions:
  contents: read      # 读仓库
  pages: write        # 写 Pages 站点
  id-token: write     # 部署用的 OIDC 令牌

# 同一时间只跑一份；不取消正在进行的部署（避免站点处于半发布状态）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.pages.outcome != 'success' }}   # 传下去：Pages 不可用就别白跑部署
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # enablement: true = 若仓库还没开 Pages，就用工作流令牌帮你开（省掉手动去 Settings 点一步）
      # continue-on-error：私有仓库 + Free 计划会失败 —— 那种情况交给下一步给出可读提示，而不是让工作流报红
      - name: 准备 Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages 不可用时的说明
        if: steps.pages.outcome != 'success'
        run: |
          # 顺手查一下 Pages 到底开没开（公开仓库可匿名查；200=已开 / 404=未开）
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "Pages API 状态码：$CODE"
          echo "::warning title=Pages 未启用::站点未发布（Pages API 返回 $CODE）。请到仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」，然后重跑本工作流。本地预览：双击 Revolution.Document/预览文档.cmd。"
          {
            echo "## 📄 文档站未发布：Pages 还没开（API 返回 $CODE）"
            echo ""
            echo "**一次性操作**（做完本工作流全自动，之后改文档即自动发布）："
            echo ""
            echo "1. 打开 https://github.com/${GITHUB_REPOSITORY}/settings/pages"
            echo "2. **Build and deployment → Source** 选 **GitHub Actions**（不要选 Deploy from a branch）"
            echo "3. 回到本工作流点 **Re-run all jobs**，或再推一次 \`Revolution.Document/\` 里的改动"
            echo ""
            echo "> 为什么必须手动这一步：Pages 站点必须由**有 admin 权限的人**创建一次 —— 工作流令牌没有这个权限，"
            echo "> 之前的报错就是 \`Resource not accessible by integration\`（Create Pages site failed）。"
            echo "> 若第 2 步里看不到 GitHub Actions 选项：说明该仓库的 Pages 不可用（私有仓库需要 Pro/Team 计划；Public 仓库不受限）。"
            echo "> 本地随时可看：双击 \`Revolution.Document/预览文档.cmd\`，或直接双击 \`index.html\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 生成站点文件
        if: steps.pages.outcome == 'success'
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          doc  = pathlib.Path('Revolution.Document')
          site = pathlib.Path('_site')
          site.mkdir(exist_ok=True)

          # ① 文档目录整体拷贝（.html 与 .md 都带，保持相对结构；.cmd 之类的辅助文件跳过）
          for p in doc.rglob('*'):
              if p.is_file() and p.suffix.lower() in ('.html', '.md', '.css', '.js', '.png', '.jpg', '.svg'):
                  dst = site / p.relative_to(doc)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(p.read_bytes())

          # ② .nojekyll：不再让 Pages 走 Jekyll 处理（否则下划线开头的文件会被跳过）
          (site / '.nojekyll').write_text('')

          # ③ 链接修正：站内没有的目标（.md 文档、仓库根 README/LICENSE、框架说明）
          #    改成 GitHub 上的渲染地址 —— 那边有目录与排版，比让浏览器下载纯文本好读
          repo = os.environ.get('GITHUB_REPOSITORY', 'Yokino337088/Revolution')
          blob = f'https://github.com/{repo}/blob/main/'

          idx  = site / 'index.html'
          html = idx.read_text(encoding='utf-8')

          def fix(m):
              href = m.group(1)
              if href.startswith(('http://', 'https://', '#', 'mailto:')):
                  return m.group(0)
              if href.startswith('../'):                       # 指向仓库根的路径（README / LICENSE / 框架目录）
                  return f'href="{blob}{href[3:]}"'
              if href.endswith('.md'):                         # 文档的 markdown 版本
                  return f'href="{blob}Revolution.Document/{href}"'
              return m.group(0)

          html, n = re.subn(r'href="([^"]+)"', fix, html)
          idx.write_text(html, encoding='utf-8')

          files = [f for f in site.rglob('*') if f.is_file()]
          print(f'站点文件 {len(files)} 个，改写链接 {n} 处')
          PY

      - name: 上传站点产物
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
